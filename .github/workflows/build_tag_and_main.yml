name: build-and-push-tag-and-main
on:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test and vet
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            golang:1.27.2@sha256:820153096fda4de6ac1b7194d12e416b7dd8f4e9a33d17e0345b111b945162d8 \
            sh -c 'go test ./... && go vet ./...'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: publish
        run: |
          image=ghcr.io/stefanoghinelli/configmap-reload
          docker buildx build \
            --platform linux/arm64/v8,linux/amd64,linux/arm,linux/ppc64le,linux/s390x \
            -t "$image:${{ github.ref_name == 'main' && 'dev' || github.ref_name }}" \
            --metadata-file build-metadata.json \
            --push \
            .
          digest=$(jq -r '."containerimage.digest" // empty' build-metadata.json)
          test -n "$digest"
          docker buildx imagetools inspect "$image@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          token: ${{ github.token }}
          make_latest: true
          generate_release_notes: true
          body: |
            Container image: `ghcr.io/stefanoghinelli/configmap-reload@${{ needs.build-and-push.outputs.digest }}`
